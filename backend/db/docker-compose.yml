services:
  redis:
    image: redis:7-alpine
    container_name: trishula-ground-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  postgres:
    image: postgres:17
    container_name: trishula-ground-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: trishula_ground
      POSTGRES_USER: trishula
      POSTGRES_PASSWORD: trishula_dev
    ports:
      - "5433:5432"
    volumes:
      - trishula_ground_pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro

  kafka:
    image: apache/kafka:4.0.0
    container_name: trishula-ground-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

volumes:
  trishula_ground_pgdata:
